fill="#f472b6"/><text class="num" x="912" y="105" text-anchor="end" fill="#f472b6">04</text><text class="tt" x="768" y="136">Stream Workers</text><text class="sb" x="768" y="160">Flink · Celery</text><text class="sb" x="768" y="180">Async jobs</text><rect x="990" y="80" width="180" height="114" rx="14" fill="#111927" stroke="#2b3442" stroke-width="1.2"/><rect class="fl" x="990" y="80" width="180" height="114" rx="14" fill="#34d399" fill-opacity=".1" stroke="#34d399" stroke-width="2" style="animation-delay:-2.2s"/><rect x="1008" y="98" width="30" height="4" rx="2" fill="#34d399"/><text class="num" x="1152" y="105" text-anchor="end" fill="#34d399">05</text><text class="tt" x="1008" y="136">Data Layer</text><text class="sb" x="1008" y="160">PostgreSQL · Redis</text><text class="sb" x="1008" y="180">SQL Server</text><path class="ln" d="M215 137H261"/><path d="M261 132.5L269 137L261 141.5Z" fill="#6e7681"/><text class="el" x="240" y="125" text-anchor="middle">HTTP</text><circle r="4.6" fill="#22d3ee" filter="url(#gl)" opacity="0"><animateMotion dur="3.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;.2667;1" path="M212 137H266"/><animate attributeName="opacity" dur="3.0s" repeatCount="indefinite" calcMode="discrete" values="1;0" keyTimes="0;.2667"/></circle><path class="ln" d="M455 137H501"/><path d="M501 132.5L509 137L501 141.5Z" fill="#6e7681"/><text class="el" x="480" y="125" text-anchor="middle">publish</text><circle r="4.6" fill="#60a5fa" filter="url(#gl)" opacity="0"><animateMotion dur="3.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;.3333;.6;1" path="M452 137H506"/><animate attributeName="opacity" dur="3.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;.3333;.6"/></circle><path class="ln" d="M695 137H741"/><path d="M741 132.5L749 137L741 141.5Z" fill="#6e7681"/><text class="el" x="720" y="125" text-anchor="middle">consume</text><circle r="4.6" fill="#a78bfa" filter="url(#gl)" opacity="0"><animateMotion dur="3.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;.6667;.9333;1" path="M692 137H746"/><animate attributeName="opacity" dur="3.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;.6667;.9333"/></circle><path class="ln" d="M935 137H981"/><path d="M981 132.5L989 137L981 141.5Z" fill="#6e7681"/><text class="el" x="960" y="125" text-anchor="middle">persist</text><circle r="4.6" fill="#f472b6" filter="url(#gl)" opacity="0"><animateMotion dur="3.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;.2667;1" path="M932 137H986"/><animate attributeName="opacity" dur="3.0s" repeatCount="indefinite" calcMode="discrete" values="1;0" keyTimes="0;.2667"/></circle><path class="ln" d="M840 197V248Q840 262 826 262H134Q120 262 120 248V204"/><path d="M115.5 204L120 196L124.5 204Z" fill="#6e7681"/><text class="el" x="480" y="284" text-anchor="middle">real-time push · WebSockets + Redis pub/sub</text><circle r="4.6" fill="#f472b6" filter="url(#gl)" opacity="0"><animateMotion dur="3.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;.7333;1" path="M840 197V248Q840 262 826 262H134Q120 262 120 248V204"/><animate attributeName="opacity" dur="3.0s" repeatCount="indefinite" calcMode="discrete" values="1;0" keyTimes="0;.7333"/></circle>
</g>
