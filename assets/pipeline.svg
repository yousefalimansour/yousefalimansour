<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 322" width="1200" height="322" role="img" aria-label="Animated architecture diagram: clients call REST APIs (Django REST Framework, FastAPI, ASP.NET Core), which publish events to Apache Kafka; stream workers (Apache Flink, Celery) consume them, persist to PostgreSQL, Redis and SQL Server, and push real-time updates back to clients over WebSockets.">
<title>Animated architecture diagram: clients call REST APIs (Django REST Framework, FastAPI, ASP.NET Core), which publish events to Apache Kafka; stream workers (Apache Flink, Celery) consume them, persist to PostgreSQL, Redis and SQL Server, and push real-time updates back to clients over WebSockets.</title>
<defs>
<clipPath id="card"><rect width="1200" height="322" rx="22"/></clipPath><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0f1e"/><stop offset=".55" stop-color="#0d1117"/><stop offset="1" stop-color="#140f2a"/></linearGradient>
<filter id="gl" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
.tt{font:700 18.5px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#e6edf3}
.sb{font:400 14.5px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#9da7b3}
.num{font:700 13px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;opacity:.85}
.el{font:500 13px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#8b949e}
.hd{font:500 15px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#8b949e}
.lv{font:600 13.5px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#7ee787}
.ln{fill:none;stroke:#6e7681;stroke-width:1.5;stroke-dasharray:5 6;animation:march .9s linear infinite}
@keyframes march{to{stroke-dashoffset:-22}}
.fl{opacity:0;animation:flash 3s linear infinite}
@keyframes flash{0%{opacity:0}5%{opacity:1}34%{opacity:0}100%{opacity:0}}
.halo{transform-box:fill-box;transform-origin:center;animation:halo 1.8s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.7}100%{transform:scale(2.1);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<g clip-path="url(#card)">
<rect width="1200" height="322" fill="url(#bg)"/>
<text class="hd" x="32" y="46">// event-driven by design: one request, end to end</text>
<circle class="halo" cx="1040" cy="41" r="4.5" fill="#3fb950"/>
<circle cx="1040" cy="41" r="4" fill="#3fb950"/>
<text class="lv" x="1052" y="46">live event flow</text>
