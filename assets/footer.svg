<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="1200" height="170" role="img" aria-label="Building systems that scale, systems that stream, systems that last.">
<title>Building systems that scale, systems that stream, systems that last.</title>
<defs>
<clipPath id="card"><rect width="1200" height="170" rx="22"/></clipPath><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0f1e"/><stop offset=".55" stop-color="#0d1117"/><stop offset="1" stop-color="#140f2a"/></linearGradient>
<linearGradient id="ng" gradientUnits="userSpaceOnUse" x1="260" y1="0" x2="940" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#22d3ee"/><stop offset=".35" stop-color="#60a5fa"/><stop offset=".7" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/><animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1360 0" dur="6s" repeatCount="indefinite"/></linearGradient>
</defs>
<style>
.q{font:600 23px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.s{font:500 13px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#7d8590}
.w0{animation:w0 11s linear infinite}@keyframes w0{to{transform:translateX(-600px)}}.w1{animation:w1 16s linear infinite}@keyframes w1{to{transform:translateX(-800px)}}.w2{animation:w2 8s linear infinite}@keyframes w2{to{transform:translateX(-480px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<g clip-path="url(#card)">
<rect width="1200" height="170" fill="url(#bg)"/>
